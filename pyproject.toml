[project]
name = "rpg-support-bot"
version = "0.1.0"
description = "RAG-powered RPG support bot for tabletop RPG rules and world building"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "chromadb>=0.5.0",
    "langdetect>=1.0.9",
    "prompt-toolkit>=3.0.0",
    "pydantic-settings>=2.0.0",
    "pymupdf>=1.24.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "rank-bm25>=0.2.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
rpg-bot = "rpg_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpg_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

llm:
  # backend: "anthropic" or "openai" (for LM Studio / ollama / any OpenAI-compatible API)
  backend: "anthropic"
  model: "claude-sonnet-4-20250514"
  max_tokens: 4096
  temperature: 0.3
  # base_url: set for local servers, omit or leave empty for real OpenAI API
  # base_url: "http://localhost:1234/v1"   # LM Studio
  # base_url: "http://localhost:11434/v1"  # Ollama

embeddings:
  model: "text-embedding-nomic-embed-text-v1.5"
  base_url: "http://localhost:1234/v1"
  # For Ollama: base_url: "http://localhost:11434/v1"

chunking:
  chunk_size: 1500
  chunk_overlap: 200

retrieval:
  top_k: 15
  relevance_threshold: 1.0

chromadb:
  persist_directory: "data/chromadb"
  collection_name: "rpg_sourcebooks"

sourcebooks_directory: "sourcebooks"

stt:
  # Speech-to-text via whisper.cpp server or any OpenAI-compatible Whisper endpoint
  enabled: false
  # backend: "whisper-cpp" (default) or "openai" (for OpenAI API, faster-whisper-server, Ollama)
  backend: "whisper-cpp"
  model: "whisper-1"
  # whisper.cpp server default:
  base_url: "http://localhost:8080"
  # For OpenAI-compatible backends, set backend: "openai" and:
  # base_url: "http://localhost:8080/v1"   # faster-whisper-server
  # base_url: "http://localhost:11434/v1"  # Ollama
  # base_url: ""                           # real OpenAI API (needs OPENAI_API_KEY)

web:
  server_port: 7860
  share: false

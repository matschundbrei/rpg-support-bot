llm:
  # backend: "anthropic" or "openai" (for LM Studio / ollama / any OpenAI-compatible API)
  backend: "anthropic"
  model: "claude-sonnet-4-20250514"
  max_tokens: 4096
  temperature: 0.3
  # base_url: only used with "openai" backend (e.g. "http://localhost:1234/v1")
  # base_url: "http://localhost:1234/v1"

embeddings:
  model: "text-embedding-nomic-embed-text-v1.5"
  base_url: "http://localhost:1234/v1"
  # For Ollama: base_url: "http://localhost:11434/v1"

chunking:
  chunk_size: 1500
  chunk_overlap: 200

retrieval:
  top_k: 15
  relevance_threshold: 1.0

chromadb:
  persist_directory: "data/chromadb"
  collection_name: "rpg_sourcebooks"

sourcebooks_directory: "sourcebooks"

web:
  server_port: 7860
  share: false
